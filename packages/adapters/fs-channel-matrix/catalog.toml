# fs-channel-matrix — Matrix Channel Adapter

[package]
id          = "freeSynergy.channel-matrix"
name        = "FreeSynergy Matrix Channel"
type        = "adapter"
version     = "0.1.0"
summary     = "Matrix channel adapter — implements Channel-Trait via matrix-sdk"
icon        = "icon.svg"
tags        = ["messaging", "matrix", "channel", "adapter"]
author      = "FreeSynergy.Net"
license     = "MIT"

[provides]
capabilities = ["channel.matrix"]

# fs-bots uses the matrix-bot feature (CS-API via reqwest, no matrix-sdk).
# The full matrix-sdk live feature is disabled until upstream fixes the
# rustc ≥1.94 recursion overflow (matrix-sdk 0.16 known issue).
[notes]
bot_feature     = "matrix-bot"
live_feature    = "matrix (disabled — upstream bug)"
iam_integration = "Tuwunel OIDC via Kanidm — all accounts are Kanidm identities"

[sources]
repo = "https://github.com/FreeSynergy/fs-channel-matrix"
