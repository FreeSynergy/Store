# fs-db-engine-postgres — PostgreSQL Database Engine Adapter

[package]
id               = "freeSynergy.db-engine-postgres"
name             = "FreeSynergy PostgreSQL Engine"
type             = "adapter"
version          = "0.1.0"
summary          = "PostgreSQL database engine adapter — implements DbEngine-Trait"
description      = "The PostgreSQL database engine adapter connects FreeSynergy to a running PostgreSQL server. It implements the DbEngine trait and is the recommended engine for multi-node and production deployments. Requires a running Postgres container (available as a separate Store package)."
description_file = "i18n/en/description.ftl"
icon             = "icon.svg"
tags             = ["database", "postgres", "adapter", "db-engine", "production"]
screenshots      = [
    "https://raw.githubusercontent.com/FreeSynergy/Store/main/screenshots/db-engine-postgres-1.png",
]
author           = "FreeSynergy.Net"
license          = "MIT"

[package.origin]
git       = "https://github.com/FreeSynergy/fs-db-engine-postgres"
publisher = "FreeSynergy"

[provides]
capabilities = ["db.engine.postgres"]

[requires]
capabilities = ["db.server.postgres"]

[install_targets]
artifact  = true
container = false

[sources]
repo = "https://github.com/FreeSynergy/fs-db-engine-postgres"
