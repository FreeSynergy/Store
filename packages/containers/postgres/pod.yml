# PostgreSQL Pod — Relational Database
# Deployed via: podman play kube pod.yml
# Env vars substituted by fs-store before deploy.
#
# Containers:
#   postgres             — standard PostgreSQL image
#   fs-container-adapter — sidecar; registers database.postgres capability in fs-registry + fs-bus
apiVersion: v1
kind: Pod
metadata:
  name: postgres
  labels:
    app: freesynergy
    package: postgres
spec:
  restartPolicy: Always
  containers:
    - name: postgres
      image: docker.io/library/postgres:${POSTGRES_VERSION}
      ports:
        - containerPort: 5432
          hostPort: 5432
          protocol: TCP
          name: postgres
      env:
        - name: POSTGRES_DB
          value: "${POSTGRES_DB}"
        - name: POSTGRES_USER
          value: "${POSTGRES_USER}"
        - name: POSTGRES_PASSWORD
          value: "${POSTGRES_PASSWORD}"
        - name: PGDATA
          value: "/var/lib/postgresql/data/pgdata"
      volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
      readinessProbe:
        exec:
          command: ["pg_isready", "-U", "$(POSTGRES_USER)", "-d", "$(POSTGRES_DB)"]
        initialDelaySeconds: 10
        periodSeconds: 10

    - name: fs-container-adapter
      image: ghcr.io/freesynergy/fs-container-adapter:${FS_ADAPTER_VERSION}
      env:
        - name: FS_ADAPTER_PACKAGE_ID
          value: "postgres"
        - name: FS_ADAPTER_CAPABILITIES
          value: "sql-database,postgresql,database.postgres"
        - name: FS_ADAPTER_HEALTH_CHECK
          value: "pg_isready"
        - name: FS_REGISTRY_URL
          value: "${FS_REGISTRY_URL}"
        - name: FS_INVENTORY_URL
          value: "${FS_INVENTORY_URL}"
        - name: FS_BUS_URL
          value: "${FS_BUS_URL}"
        - name: FS_IAM_ISSUER
          value: "${FS_IAM_ISSUER}"
        - name: FS_IAM_CLIENT_ID
          value: "${FS_IAM_CLIENT_ID}"
        - name: FS_IAM_CLIENT_SECRET
          value: "${FS_IAM_CLIENT_SECRET}"
      ports:
        - containerPort: 50051
          protocol: TCP
          name: grpc

  volumes:
    - name: postgres-data
      hostPath:
        path: /var/lib/freesynergy/postgres
        type: DirectoryOrCreate
