# Tuwunel — Matrix Homeserver

[package]
id               = "tuwunel"
name             = "Tuwunel"
type             = "container"
version          = "0.5.0"
summary          = "High-performance Matrix homeserver — federation, E2EE, bridges, rooms"
description      = "Tuwunel is a high-performance Matrix homeserver written in Rust. FreeSynergy ships a fork pre-configured with Kanidm SSO and S3 media storage. Supports federation, E2EE, and Matrix bridges."
description_file = "i18n/en/description.ftl"
icon             = "icon.svg"
tags             = ["matrix", "chat", "messaging", "e2ee", "federation", "rooms", "voip"]
author           = "Tuwunel / FreeSynergy"
license          = "Apache-2.0"

[package.origin]
website   = "https://github.com/matrix-construct/tuwunel"
git       = "https://github.com/matrix-construct/tuwunel"
publisher = "Matrix Construct"

[package.fork]
source     = "fork"
fork_of    = "matrix-construct/tuwunel"
fork_repo  = "FreeSynergy/tuwunel"
fork_url   = "https://github.com/FreeSynergy/tuwunel"

[provides]
capabilities = ["matrix.homeserver", "chat.matrix"]

[requires]
# Kanidm OIDC is mandatory — all Matrix accounts are backed by FreeSynergy identities.
capabilities = ["iam.oidc-provider"]

[optional-dependencies]
s3 = ">=1"

[adapter]
id      = "fs-channel-matrix"
repo    = "FreeSynergy/fs-channel-matrix"
manager = "fs-manager-matrix"

[setup]
wizard        = "TuwunelSetupWizard"
wizard_repo   = "FreeSynergy/fs-managers"
wizard_crate  = "fs-manager-matrix"
iam_required  = true
iam_note      = "Kanidm OIDC must be configured before starting Tuwunel. All Matrix accounts are Kanidm identities."

[storage]
global = "/var/lib/freesynergy/tuwunel"
config = "/etc/freesynergy/tuwunel"

[install_targets]
container = true
rpm       = false
deb       = false
flatpak   = false

[[api.rest]]
base        = "/_matrix"
port        = 8448
proto       = "https"
description = "Matrix Client-Server API (CS-API r0/v3)"

[[api.rest]]
base        = "/_matrix/federation"
port        = 8448
proto       = "https"
description = "Matrix Server-Server Federation API"

[contract]
upstream_tls = false

[[contract.routes]]
id          = "main"
path        = "/"
strip       = false
description = "Matrix Client-Server + Federation API"
port        = 8448

[[contract.routes]]
id          = "turn"
path        = "/"
proto       = "udp"
port        = 6167
description = "TURN/STUN for VoIP"
